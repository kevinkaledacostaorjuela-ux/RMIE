<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test JavaScript - RMIE</title>
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; background: #f5f5f5; }
        .result { margin: 10px 0; padding: 10px; border-radius: 5px; }
        .success { background: #d4edda; color: #155724; border: 1px solid #c3e6cb; }
        .error { background: #f8d7da; color: #721c24; border: 1px solid #f5c6cb; }
        .info { background: #d1ecf1; color: #0c5460; border: 1px solid #bee5eb; }
        pre { background: #fff; padding: 10px; border-radius: 5px; border: 1px solid #ddd; }
    </style>
</head>
<body>
    <h1>🔍 Test de JavaScript - Sistema RMIE</h1>
    
    <div id="results"></div>
    
    <script>
        const results = document.getElementById('results');
        
        function addResult(type, message) {
            const div = document.createElement('div');
            div.className = `result ${type}`;
            div.innerHTML = message;
            results.appendChild(div);
        }
        
        // Capturar errores JavaScript
        let errorCount = 0;
        window.addEventListener('error', function(e) {
            errorCount++;
            addResult('error', `❌ Error JavaScript #${errorCount}: ${e.message} en línea ${e.lineno}`);
        });
        
        // Capturar promesas rechazadas
        window.addEventListener('unhandledrejection', function(e) {
            addResult('error', `❌ Promesa rechazada: ${e.reason}`);
            e.preventDefault();
        });
        
        // Test 1: Verificar elementos DOM
        addResult('info', '🔍 <strong>Test 1:</strong> Verificando elementos DOM del dashboard...');
        
        const testElements = ['mobileToggle', 'sidebar', 'sidebarOverlay', 'currentDateTime'];
        let foundElements = 0;
        
        testElements.forEach(id => {
            const element = document.getElementById(id);
            if (element) {
                addResult('success', `✅ Elemento '${id}' encontrado`);
                foundElements++;
            } else {
                addResult('error', `❌ Elemento '${id}' no encontrado (normal en esta página de test)`);
            }
        });
        
        // Test 2: Verificar sintaxis try-catch
        addResult('info', '🔍 <strong>Test 2:</strong> Probando bloques try-catch...');
        
        try {
            // Simular código que podría fallar
            const testElement = document.getElementById('nonexistent');
            if (testElement) {
                testElement.innerHTML = 'test';
            } else {
                addResult('success', '✅ Verificación de elemento inexistente manejada correctamente');
            }
        } catch (error) {
            addResult('success', '✅ Try-catch funcionando: ' + error.message);
        }
        
        // Test 3: Verificar manejo de promesas
        addResult('info', '🔍 <strong>Test 3:</strong> Probando manejo de promesas...');
        
        Promise.resolve('test')
            .then(result => {
                addResult('success', '✅ Promesa resuelta correctamente: ' + result);
            })
            .catch(error => {
                addResult('error', '❌ Error en promesa: ' + error);
            });
        
        // Test 4: Simular error controlado
        addResult('info', '🔍 <strong>Test 4:</strong> Probando captura de errores...');
        
        try {
            throw new Error('Error de prueba controlado');
        } catch (error) {
            addResult('success', '✅ Error capturado correctamente: ' + error.message);
        }
        
        // Resultado final después de un momento
        setTimeout(() => {
            addResult('info', `<strong>📊 Resumen del test:</strong>`);
            
            if (errorCount === 0) {
                addResult('success', '🎉 <strong>¡ÉXITO!</strong> No se detectaron errores JavaScript no controlados.');
                addResult('success', '✅ El sistema de manejo de errores está funcionando correctamente.');
                addResult('success', '✅ Los bloques try-catch están implementados correctamente.');
            } else {
                addResult('error', `❌ Se detectaron ${errorCount} errores JavaScript no controlados.`);
            }
            
            addResult('info', '<strong>💡 Instrucciones:</strong> Si ves este mensaje, significa que el JavaScript básico está funcionando. Los errores "Uncaught (in promise)" del dashboard deberían estar resueltos.');
        }, 1000);
    </script>
</body>
</html>
