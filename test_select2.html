<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test Select2 Multiple</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/css/select2.min.css" rel="stylesheet" />
    <link href="https://cdn.jsdelivr.net/npm/select2-bootstrap-5-theme@1.3.0/dist/select2-bootstrap-5.min.css" rel="stylesheet" />
</head>
<body>
    <div class="container mt-5">
        <h2>Prueba Select2 Multiple</h2>
        
        <form method="POST" action="test_select2_process.php" id="testForm">
            <div class="mb-3">
                <label for="clientes" class="form-label">Seleccionar Clientes</label>
                <select name="clientes[]" id="clientes" multiple class="form-select">
                    <option value="1">Cliente 1</option>
                    <option value="2">Cliente 2</option>
                    <option value="3">Cliente 3</option>
                    <option value="28">Cliente 28</option>
                    <option value="29">Cliente 29</option>
                </select>
            </div>
            
            <button type="submit" class="btn btn-primary">Enviar</button>
        </form>
        
        <div id="debug"></div>
    </div>

    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/js/select2.min.js"></script>
    
    <script>
        $(document).ready(function() {
            $('#clientes').select2({
                theme: 'bootstrap-5',
                placeholder: 'Selecciona clientes...',
                allowClear: true,
                width: '100%'
            });
            
            $('#testForm').on('submit', function(e) {
                e.preventDefault();
                
                console.log('=== DEBUG FORM ===');
                
                const formData = new FormData(this);
                console.log('FormData entries:');
                for (let [key, value] of formData.entries()) {
                    console.log(`  ${key}: ${value}`);
                }
                
                const select = document.getElementById('clientes');
                console.log('Select element:', select);
                console.log('Select name:', select.name);
                console.log('Select multiple:', select.multiple);
                console.log('Selected options:', Array.from(select.selectedOptions).map(opt => opt.value));
                console.log('Select2 val():', $('#clientes').val());
                
                // Mostrar resultados en página
                const debug = document.getElementById('debug');
                debug.innerHTML = `
                    <h3>Resultados:</h3>
                    <p><strong>FormData entries:</strong></p>
                    <ul>
                        ${Array.from(formData.entries()).map(([key, value]) => `<li>${key}: ${value}</li>`).join('')}
                    </ul>
                    <p><strong>Select2 value:</strong> ${JSON.stringify($('#clientes').val())}</p>
                `;
                
                console.log('=== FIN DEBUG ===');
            });
        });
    </script>
</body>
</html>
